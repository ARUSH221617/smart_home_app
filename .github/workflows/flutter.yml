name: Flutter CI/CD Workflow

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-macos-ios-android:
    name: Flutter Build (macOS + iOS + Android)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"
      - run: flutter pub get
      - run: dart run easy_localization:generate -f keys -o locale_keys.g.dart --source-dir assets/translations
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test
      - name: Install iOS pods
        run: |
          cd ios
          rm -f Podfile.lock          # ← fix for the conflict
          pod install --repo-update
      - run: flutter build ios --debug --simulator
      - run: flutter build apk --debug

  build-windows:
    name: Flutter Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"
      - run: flutter pub get
      - run: dart run easy_localization:generate -f keys -o locale_keys.g.dart --source-dir assets/translations
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test
      - run: flutter build windows --release
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/x64/runner/Release/
