  build-windows-debug:
    name: Build Windows Debug
    runs-on: windows-latest
    needs: analyze

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - run: dart run easy_localization:generate -f keys -o locale_keys.g.dart --source-dir assets/translations

      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows Debug
        run: flutter build windows --debug

  build-windows-release:
    name: Build Windows Release
    runs-on: windows-latest
    needs: build-windows-debug

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - run: dart run easy_localization:generate -f keys -o locale_keys.g.dart --source-dir assets/translations

      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Create installer script
        shell: powershell
        run: |
          $issContent = @"
          [Setup]
          AppName=MyApp
          AppVersion=1.0
          DefaultDirName={pf}\MyApp
          DefaultGroupName=MyApp
          OutputDir=dist
          OutputBaseFilename=myapp-installer
          Compression=lzma
          SolidCompression=yes

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: recursesubdirs

          [Icons]
          Name: "{group}\MyApp"; Filename: "{app}\smart_home_app.exe"
          "@

          [System.IO.File]::WriteAllText("$pwd\installer.iss", $issContent, [System.Text.Encoding]::ASCII)

      - name: Build Installer
        run: iscc installer.iss

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/myapp-installer.exe
