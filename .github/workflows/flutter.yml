name: Flutter CI/CD Workflow

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ------------------- macOS + iOS (simulator) -------------------
  build-ios:
    name: Build iOS (simulator)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4 # upgraded to v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9" # keep as you need

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization files
        run: dart run easy_localization:generate -f keys -o locale_keys.g.dart --source-dir assets/translations

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test

      - name: Fix Podfile – set minimum iOS version to 13.0
        run: |
          cd ios
          # Update platform line if it exists, otherwise insert it
          if grep -q "platform :ios" Podfile; then
            sed -i '' 's/platform :ios, .*/platform :ios, '\''13.0'\''/' Podfile
          else
            sed -i '' '1i\
            platform :ios, '\''13.0'\''
            ' Podfile
          fi

      - name: Install iOS pods (with lockfile reset)
        run: |
          cd ios
          rm -f Podfile.lock
          pod install --repo-update

      - name: Build iOS (simulator)
        run: flutter build ios --debug --simulator

  # ------------------- Android (APK) -------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest # faster & cheaper than macOS for Android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization files
        run: dart run easy_localization:generate -f keys -o locale_keys.g.dart --source-dir assets/translations

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload APK (optional)
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  # ------------------- Windows -------------------
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization files
        run: dart run easy_localization:generate -f keys -o locale_keys.g.dart --source-dir assets/translations

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/x64/runner/Release/
